<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información de Usuario Aleatorio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .user-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }

        .user-avatar {
            text-align: center;
            margin-bottom: 15px;
        }

        .user-avatar img {
            border-radius: 50%;
            border: 3px solid #007bff;
        }

        .info-group {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }

        .info-group strong {
            color: #333;
        }
    </style>
</head>
<body>

    <button onclick="obtenerUsuario()">Cargar Nuevo Usuario</button>

    <div id="user-container" class="user-card" style="display: none;">
        <div class="user-avatar">
            <img id="avatar" src="" alt="Foto de perfil">
        </div>
        
        <div class="info-group">
            <strong>Nombre completo:</strong> <span id="nombre"></span>
        </div>
        
        <div class="info-group">
            <strong>Género:</strong> <span id="genero"></span>
        </div>

        <div class="info-group">
            <strong>Correo electrónico:</strong> <span id="email"></span>
        </div>

        <div class="info-group">
            <strong>Ubicación:</strong> <span id="ubicacion"></span>
        </div>

        <div class="info-group">
            <strong>Usuario y Contraseña:</strong> <span id="login-info"></span>
        </div>

        <div class="info-group">
            <strong>Fecha de Nacimiento / Edad:</strong> <span id="dob"></span>
        </div>

        <div class="info-group">
            <strong>Teléfono:</strong> <span id="telefono"></span>
        </div>

        <div class="info-group">
            <strong>ID (Identificación):</strong> <span id="id-info"></span>
        </div>

        <div class="info-group">
            <strong>Nacionalidad:</strong> <span id="nat"></span>
        </div>
    </div>

    <script>
        async function obtenerUsuario() {
            try {
                const respuesta = await fetch('https://randomuser.me/api/');
                const datos = await respuesta.json();
                const usuario = datos.results[0];

                // Foto de perfil
                document.getElementById('avatar').src = usuario.picture.large;

                // Nombre completo
                document.getElementById('nombre').textContent = 
                    `${usuario.name.title} ${usuario.name.first} ${usuario.name.last}`;

                // Género
                document.getElementById('genero').textContent = usuario.gender;

                // Correo
                document.getElementById('email').textContent = usuario.email;

                // Ubicación (Dirección completa)
                document.getElementById('ubicacion').textContent = 
                    `${usuario.location.street.name} #${usuario.location.street.number}, ${usuario.location.city}, ${usuario.location.state}, ${usuario.location.country} (${usuario.location.postcode})`;

                // Login
                document.getElementById('login-info').textContent = 
                    `Usuario: ${usuario.login.username} | Clave: ${usuario.login.password}`;

                // Fecha de nacimiento
                const fecha = new Date(usuario.dob.date).toLocaleDateString();
                document.getElementById('dob').textContent = `${fecha} (${usuario.dob.age} años)`;

                // Teléfonos
                document.getElementById('telefono').textContent = `${usuario.phone} / Celular: ${usuario.cell}`;

                // Documento ID
                document.getElementById('id-info').textContent = `${usuario.id.name || 'N/A'}: ${usuario.id.value || 'N/A'}`;

                // Nacionalidad
                document.getElementById('nat').textContent = usuario.nat;

                // Mostrar el contenedor
                document.getElementById('user-container').style.display = 'block';

            } catch (error) {
                console.error('Error al obtener los datos:', error);
            }
        }

        // Cargar un usuario automáticamente al abrir la página
        obtenerUsuario();
    </script>

</body>
</html>
